<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background: Deep Space Obsidian with subtle sapphire vignetting -->
    <linearGradient id="ult_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#04060c"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Squircle Border: Chiseled cyber rim with top-edge specular glint -->
    <linearGradient id="ult_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Left Wing: Deep Royal Sapphire to Vivid Blue -->
    <linearGradient id="ult_wing_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right Wing: Vivid Cobalt to Electric Cyan-Blue -->
    <linearGradient id="ult_wing_right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- The Uplift Center Arrow: Neon Electric Cyan into Pure White Apex -->
    <linearGradient id="ult_arrow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#00f2fe"/>
      <stop offset="90%" stop-color="#e0f9ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Base U-Cradle: High-speed aerodynamic connective bridge -->
    <linearGradient id="ult_cradle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Specular Highlight for Left Wing Top Bevel -->
    <linearGradient id="ult_bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="ult_core_glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Logo Depth -->
    <filter id="ult_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container Squircle (26px corner radius, standard Apple/Figma proportion) -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#ult_bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#ult_core_glow)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" stroke="url(#ult_rim)" stroke-width="1.5"/>

  <!-- THE MASTER MARK -->
  <g filter="url(#ult_shadow)" transform="translate(0, 1)">
    <!-- LEFT WING OF "W" -->
    <!-- Crisp 70° rake, perfectly chamfered top and bottom -->
    <path d="M 22 36 L 40 36 L 52 76 L 37 76 Z" fill="url(#ult_wing_left)"/>
    <!-- Left Inner Incline Blade (Snap-fitted with 4px negative space from center arrow) -->
    <path d="M 40 76 L 52 76 L 59 52 L 49 52 Z" fill="url(#ult_wing_left)"/>

    <!-- RIGHT WING OF "W" -->
    <!-- Right Inner Incline Blade -->
    <path d="M 69 52 L 79 52 L 88 76 L 76 76 Z" fill="url(#ult_wing_right)"/>
    <!-- Right Outer Blade -->
    <path d="M 76 76 L 91 76 L 106 36 L 88 36 Z" fill="url(#ult_wing_right)"/>

    <!-- THE UPLIFT ARROW (The "Updater" Engine & Central Apex) -->
    <!-- Soaring from Y=86 up to razor-sharp peak at Y=18 -->
    <!-- Perfect equilateral 60° arrowhead with aerodynamic tapered tail -->
    <path d="M 64 18 L 78 48 L 64 42 L 50 48 Z" fill="#ffffff"/>
    <path d="M 50 48 L 64 42 L 78 48 L 64 86 Z" fill="url(#ult_arrow)"/>

    <!-- THE U-CRADLE (Seamless continuous aerodynamic arc linking W & U) -->
    <!-- Continuous curvature from left anchor to right anchor -->
    <path d="M 24 80 C 24 100, 104 100, 104 80 L 94 80 C 94 94, 34 94, 34 80 Z" fill="url(#ult_cradle)"/>

    <!-- SPECULAR BEVEL HIGHLIGHTS (Ultra-premium diamond finish) -->
    <!-- Top bevel of Left Wing -->
    <polygon points="22,36 40,36 38,38 24,38" fill="url(#ult_bevel)"/>
    <!-- Top bevel of Right Wing -->
    <polygon points="88,36 106,36 104,38 90,38" fill="url(#ult_bevel)"/>
    <!-- Apex Beacon Spark -->
    <circle cx="64" cy="18" r="1.5" fill="#ffffff"/>
  </g>
</svg>